spring.application.name=jasper-report-service

# Port the HTTP API listens on. Override it per environment without rebuilding
# the jar: set server.port in config/service.properties (see
# config/service.properties.example), pass --server.port=9090 as a command line
# argument, or set the SERVER_PORT environment variable.
server.port=8080

# Directory .jrxml report files are read from for the render endpoint.
# Loaded relative to the working directory the app is started from.
reports.directory=./reports

# Local, untracked files holding environment-specific settings, loaded relative
# to the working directory the app is started from.
#   db.properties      SQL Server connection settings
#                      (spring.datasource.url/username/password/...). Required:
#                      without it the app fails to start with "Failed to
#                      configure a DataSource". Note that the import below is
#                      marked optional only so that startup does not stop at the
#                      missing file - the DataSource auto-configuration then
#                      fails instead.
#   service.properties server.port, reports.directory and other runtime settings.
#                      Optional: the defaults above apply when it is absent.
# See config/*.example for the expected keys.
spring.config.import=optional:file:./config/db.properties,optional:file:./config/service.properties
